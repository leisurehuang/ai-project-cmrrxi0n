version: '3.8'

services:
  # PostgreSQL 数据库服务
  postgres:
    image: postgres:14-alpine
    container_name: mini_game_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: mini_game_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mini_game_net

  # Node.js 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini_game_server
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@postgres:5432/mini_game_db?schema=public
      - PORT=3000
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - mini_game_net

volumes:
  postgres_data:

networks:
  mini_game_net:
    driver: bridge
